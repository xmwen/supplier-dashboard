<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>采购风险看板</title>
    <style>
        :root {
            --bg: #0f1117;
            --card: #1a1d27;
            --border: #2a2d3a;
            --text: #e4e4e7;
            --text-muted: #8b8d9a;
            --accent: #3b82f6;
            --high: #ef4444;
            --mid: #f59e0b;
            --low: #22c55e;
            --none: #6b7280;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* 固定顶栏：header + page-nav 合一 */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: var(--bg);
        }

        .header {
            background: linear-gradient(135deg, #1e3a5f 0%, #0f1117 100%);
            padding: 20px 16px 14px;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
        }

        .header .subtitle {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* 页面导航 */
        .page-nav {
            display: flex;
            gap: 0;
            padding: 0 16px;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
        }

        .page-nav-btn {
            flex: 1;
            padding: 12px 16px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            text-align: center;
        }

        .page-nav-btn.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .page-nav-btn:hover:not(.active) {
            color: var(--text);
        }

        /* 内容区需要留出固定顶栏的空间 — JS 动态设置 */
        .main-content {
            padding-top: 0;
        }

        /* 页面容器 */
        .page { display: none; }
        .page.active { display: block; }

        /* 日期选择器 */
        .date-tabs {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
        }
        .date-tabs::-webkit-scrollbar { display: none; }

        .date-tab {
            flex-shrink: 0;
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text-muted);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .date-tab.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .date-tab:hover:not(.active) {
            border-color: var(--accent);
            color: var(--text);
        }

        .date-tab .risk-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-left: 6px;
            vertical-align: middle;
        }

        /* 统计栏 */
        .stats-bar {
            display: flex;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--bg);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .stat-item .count {
            font-weight: 600;
            font-size: 16px;
        }

        .stat-high .count { color: var(--high); }
        .stat-mid .count { color: var(--mid); }
        .stat-low .count { color: var(--low); }
        .stat-none .count { color: var(--none); }

        /* 快报内容 */
        .report-content {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .supplier-card {
            background: var(--card);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
            transition: transform 0.2s;
        }

        .supplier-card:hover {
            transform: translateY(-1px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
        }

        .supplier-name {
            font-size: 15px;
            font-weight: 600;
        }

        .supplier-product {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .risk-badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }

        .risk-high { background: rgba(239,68,68,0.15); color: var(--high); }
        .risk-mid { background: rgba(245,158,11,0.15); color: var(--mid); }
        .risk-low { background: rgba(34,197,94,0.15); color: var(--low); }
        .risk-none { background: rgba(107,114,128,0.15); color: var(--none); }

        .card-body {
            padding: 14px 16px;
        }

        .risk-signal {
            padding: 8px 0;
            border-bottom: 1px solid rgba(42,45,58,0.5);
            font-size: 13px;
            line-height: 1.7;
        }

        .risk-signal:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .no-risk {
            color: var(--text-muted);
            font-size: 13px;
            font-style: italic;
        }

        /* 底部信息 */
        .report-footer {
            padding: 12px 16px;
            border-top: 1px solid var(--border);
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
        .empty-state .text { font-size: 14px; }

        /* 加载状态 */
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }

        /* ===== 供应商采购报告页 ===== */

        /* 报告正文（markdown 渲染结果） */
        .report-html-body {
            padding: 0 16px 24px;
            color: var(--text);
            font-size: 13px;
            line-height: 1.8;
        }

        .report-html-body h1 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #fff;
        }
        .report-html-body h2 {
            font-size: 16px;
            font-weight: 600;
            margin: 20px 0 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border);
            color: #fff;
        }
        .report-html-body h3 {
            font-size: 15px;
            font-weight: 600;
            margin: 16px 0 8px;
            color: var(--text);
        }
        .report-html-body h4 {
            font-size: 14px;
            font-weight: 600;
            margin: 12px 0 6px;
            color: var(--accent);
        }
        .report-html-body p {
            margin: 8px 0;
        }
        .report-html-body ul, .report-html-body ol {
            padding-left: 20px;
            margin: 8px 0;
        }
        .report-html-body li {
            margin-bottom: 4px;
        }
        .report-html-body strong {
            color: #fff;
        }
        .report-html-body blockquote {
            border-left: 3px solid var(--accent);
            padding: 8px 12px;
            margin: 8px 0;
            background: rgba(59,130,246,0.08);
            border-radius: 6px;
            color: var(--text-muted);
        }
        .report-html-body hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 16px 0;
        }
        .report-html-body table {
            width: 100%;
            border-collapse: collapse;
            margin: 12px 0;
            font-size: 12px;
            display: block;
            overflow-x: auto;
        }
        .report-html-body th, .report-html-body td {
            padding: 8px 10px;
            border-bottom: 1px solid var(--border);
            text-align: left;
        }
        .report-html-body th {
            color: var(--text-muted);
            font-weight: 500;
        }
        .report-html-body code {
            background: rgba(59,130,246,0.1);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
        }
        .report-html-body pre {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            overflow-x: auto;
            margin: 12px 0;
        }
        .report-html-body pre code {
            background: none;
            padding: 0;
        }
        .report-html-body div {
            overflow-x: auto;
        }

        /* 报告列表 */
        .report-list {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .report-list-card {
            background: var(--card);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .report-list-card:hover {
            border-color: var(--accent);
            transform: translateY(-1px);
        }

        .report-list-card .name {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .report-list-card .meta {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .report-list-card .summary {
            font-size: 13px;
            color: var(--text);
            margin-top: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* 报告详情 */
        .report-detail { display: none; }
        .report-detail.active { display: block; }

        .report-detail .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            margin: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text-muted);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .report-detail .back-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .detail-content {
            padding: 0 16px 16px;
        }

        .detail-header {
            background: var(--card);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
        }

        .detail-header .title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .detail-header .date-line {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .detail-header .overall-assessment {
            font-size: 13px;
            line-height: 1.8;
            color: var(--text);
        }

        /* 维度表格 */
        .risk-table {
            width: 100%;
            border-collapse: collapse;
            margin: 12px 0;
            font-size: 12px;
        }

        .risk-table th, .risk-table td {
            padding: 8px 10px;
            border-bottom: 1px solid var(--border);
            text-align: left;
        }

        .risk-table th {
            color: var(--text-muted);
            font-weight: 500;
        }

        .risk-table td {
            color: var(--text);
        }

        /* 详细分析章节 */
        .detail-section {
            background: var(--card);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
        }

        .detail-section h3 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        .detail-section h4 {
            font-size: 13px;
            font-weight: 600;
            margin: 12px 0 6px;
            color: var(--accent);
        }

        .detail-section p, .detail-section li {
            font-size: 13px;
            line-height: 1.8;
            color: var(--text);
        }

        .detail-section ul, .detail-section ol {
            padding-left: 20px;
        }

        .detail-section li {
            margin-bottom: 4px;
        }

        .detail-section strong {
            color: var(--text);
        }

        .detail-section .risk-label-high { color: var(--high); }
        .detail-section .risk-label-mid { color: var(--mid); }
        .detail-section .risk-label-low { color: var(--low); }

        /* SVG 图表容器 */
        .chart-container {
            background: var(--card);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
            overflow-x: auto;
        }

        .chart-container svg {
            width: 100%;
            height: auto;
            min-width: 300px;
        }

        .chart-caption {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid var(--border);
        }

        .info-note {
            font-size: 12px;
            color: var(--text-muted);
            padding: 8px 12px;
            background: rgba(59,130,246,0.08);
            border-radius: 8px;
            margin: 8px 0;
            border-left: 3px solid var(--accent);
        }

        @media (min-width: 768px) {
            .header { padding: 24px 32px 18px; }
            .header h1 { font-size: 22px; }
            .page-nav { padding: 0 32px; }
            .date-tabs { padding: 12px 32px; }
            .report-content { padding: 20px 32px; }
            .stats-bar { padding: 12px 32px; }
            .report-list { padding: 20px 32px; }
            .detail-content { padding: 0 32px 32px; }
            .report-detail .back-btn { margin: 12px 32px; }
        }
    </style>
</head>

    "htmlBody": "<p>村田制作所（MLCC）采购风险分析报告\n报告日期：2026年03月31日\n分析师：采购专家团</p>\n<p>📊 风险等级：🟡中\n总体评估：村田MLCC业务受益于AI服务器需求爆发，高端产品供不应求，财务基本面稳健（FY2026营收予想1.8万亿日元），但面临涨价15%-35%带来的采购成本上升风险、交期从4周大幅延长至20周的供应紧张风险、以及IT环境数据泄露事件的不确定性。涨价已形成行业性趋势（三星电机同步涨价），短期内采购方议价能力显著减弱。</p>\n<p>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</p>\n<p>📌 各维度风险汇总</p>\n<table>\n<thead>\n<tr>\n<th>维度优先级</th>\n<th>具体维度</th>\n<th>风险等级</th>\n<th>说明</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>⭐⭐⭐</td>\n<td>①公司财务状况</td>\n<td>🟡中</td>\n<td>FY2026 Q3营业利润受SAW减损拖累同比-13.3%，但FY2025全年增收增益，通期予想1.8万亿日元</td>\n</tr>\n<tr>\n<td>⭐⭐⭐</td>\n<td>②产能供应</td>\n<td>🔴高</td>\n<td>高端MLCC稼动率95%、询单量是产能2倍、交期4周→20周，供需严重失衡</td>\n</tr>\n<tr>\n<td>⭐⭐⭐</td>\n<td>③供应链问题</td>\n<td>🟡中</td>\n<td>涨价15%-35%4月1日生效、IT环境数据泄露事件调查中、银等原材料成本上涨</td>\n</tr>\n<tr>\n<td>⭐⭐⭐</td>\n<td>④竞争格局</td>\n<td>🟡中</td>\n<td>村田+三星电机垄断高端市场（合计市占率约55%），寡头格局限制采购方替代选择</td>\n</tr>\n<tr>\n<td>⭐⭐⭐</td>\n<td>⑤行业趋势</td>\n<td>🔴高</td>\n<td>AI服务器驱动MLCC\"超级周期\"，TrendForce判断\"AI热、消费冷\"，结构性涨价可能持续3-5年</td>\n</tr>\n<tr>\n<td>⭐⭐⭐</td>\n<td>⑥上下游动态</td>\n<td>🟡中</td>\n<td>上游钛酸钡供应紧张+银价上涨推高成本，下游AI服务器MLCC需求2030年前增长3.3倍</td>\n</tr>\n<tr>\n<td>⭐⭐</td>\n<td>⑦政策与合规</td>\n<td>❓</td>\n<td>信息不足——未检索到出口管制、关税变化等政策性信息</td>\n</tr>\n<tr>\n<td>⭐⭐</td>\n<td>⑧技术路线</td>\n<td>🟢低</td>\n<td>ULTICIRC基板量产化、TSN over 5G实证成功、电源模块新业务拓展，技术竞争力增强</td>\n</tr>\n<tr>\n<td>⭐⭐</td>\n<td>⑨客户变化</td>\n<td>❓</td>\n<td>部分覆盖——分部营收显示AI/汽车/通信占比，但无具体客户名称及订单变化信息</td>\n</tr>\n<tr>\n<td>⭐⭐</td>\n<td>⑩区域风险</td>\n<td>🟡中</td>\n<td>IT环境不正访问事件（3/6发现）调查中，影响范围未公布；产能集中于日本、菲律宾</td>\n</tr>\n<tr>\n<td>⭐</td>\n<td>⑪重大合作</td>\n<td>🟢低</td>\n<td>子公司合并（富山+氷见）、微型电池事业转让至Maxell，运营效率优化</td>\n</tr>\n<tr>\n<td>⭐</td>\n<td>⑮定价与汇率</td>\n<td>🔴高</td>\n<td>MLCC涨价15%-35%（4/1生效），三星电机先行涨价超20%，现货价已涨近20%</td>\n</tr>\n</tbody>\n</table>\n<p>🔍 关键风险点</p>\n<p>1、<strong>高端MLCC交期大幅延长，供应严重紧张</strong>\n   村田高端MLCC产线稼动率已达95%，询单量是产能的2倍，交期从4周大幅延长至20周。[来源：新浪财经/搜狐科技，2026年3月]；三星电机同步满载，行业整体高端产能不足。[来源：新浪财经/财联社，2026年2月] 采购方面临断供和交付延迟的双重风险。</p>\n<p>2、<strong>MLCC大规模涨价，采购成本显著上升</strong>\n   村田3月17日发布涨价函，AI服务器专用高容MLCC、高端车规级MLCC、射频微波MLCC涨价15%-35%，4月1日生效。[来源：腾讯新闻/证券时报，2026年3月17日] 三星电机2月已先行涨价超20%。[来源：新浪财经/搜狐科技，2026年3月] 中金等机构判断本轮为3-5年结构性涨价周期。[来源：新浪财经/搜狐科技，2026年3月]</p>\n<p>3、<strong>IT环境数据泄露事件，影响范围未明</strong>\n   村田2月28日发现IT环境存在不正访问可能，3月1日启动全面调查，确认社外关系者信息和社内信息可能被不正取得。[来源：村田官网，2026年3月6日] 危机对策本部已设立，与外部网络安全专门机构合作，但具体数据种类和规模尚未公布。若涉及客户敏感信息，可能导致交付延迟或信任危机。</p>\n<p>4、<strong>SAW滤波器商誉减损持续拖累利润</strong>\n   FY2026 Q3累计营业利润同比下降13.3%，表面波滤波器事业商誉减损损失437.98亿日元为主要原因。[来源：Gyokai Digest，2026年2月26日] 器件/模块部门录得营业赤字261亿日元。虽不直接影响MLCC供应，但反映公司在通信模块领域面临结构性挑战。</p>\n<p>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</p>\n<p>📈 详细风险分析</p>\n<h4 id=\"_1\">行业整体态势</h4>\n<p>⚠️ 风险：• MLCC行业进入AI驱动的\"超级周期\"——高端MLCC因AI服务器（GB300平台单机约3万颗，Blackwell芯片需求为前代10倍）需求爆发，供需严重失衡。[来源：新浪财经/搜狐科技，2026年3月] TrendForce判断2026Q1全球MLCC呈\"AI热、消费冷\"格局，中低端消费电子MLCC仍疲软但高端产品结构性短缺。[来源：新浪财经/财联社，2026年2月] 村田中岛社长预测AI需求扩张周期可持续3年。[来源：EE Times Japan，2026年2月27日] 行业第一梯队（日韩）持续将产能转向高附加值产品、退出中低端，结构性供需矛盾短期内难以缓解，采购方将面临持续的涨价和交期延长压力。</p>\n<h4 id=\"_2\">竞品动态分析</h4>\n<p>⚠️ 风险：• <strong>三星电机（Samsung Electro-Mechanics）</strong>：天津厂月产能1,200亿颗MLCC满载运行（菲律宾500亿颗、韩国100亿颗），2月已先行涨价超20%。[来源：新浪财经/财联社，2026年2月] 菲律宾新工厂计划将进一步扩大产能。• <strong>太阳诱电（Taiyo Yuden）</strong>：知识库记录显示FY2027扩产计划执行中。[来源：知识库事件00000008] • <strong>TDK</strong>：市占率约20%，作为村田主要竞争对手。[来源：AInvest/CHOSUNBIZ，2025年] • <strong>整体评估</strong>：日韩厂商垄断高端MLCC市场（村田约40%+三星约15%+TDK约20%），寡头格局下采购方替代选择极为有限。中国厂商（风华高科、三环集团）主要覆盖中大尺寸中低端，短期内无法替代高端产品。</p>\n<h4 id=\"1\">①公司财务状况</h4>\n<p>✅ 利好：• FY2025全年营收1,743,352M日元（+6.3%），营业利润279,702M日元（+29.8%），归母纯利益233,818M日元（+29.3%），增收增益。[来源：IFIS/MarketScreener，2026年] FY2026通期予想营收1,800,000M日元（再修正+600亿），经营基本面向好。[来源：Yahoo Finance Japan，2026年2月] 元器件部门（含MLCC）H1营收增长10.0%，利润率27.2%，MLCC牵引效应显著。[来源：Gyokai Digest，2026年2月] 分析师综合评级BUY，17位分析师平均目标价4,350日元（当前3,534，上涨空间+23%）。[来源：MarketScreener，2026年3月] 自己资本比率84.6%，财务结构极为稳健。[来源：Gyokai Digest，2026年2月]\n⚠️ 风险：• FY2026 Q3累计营业利润同比下降13.3%（SAW减损438亿日元拖累），Q3单季营业利润率仅8.1%（前期同季17.0%急落）。[来源：株探，2026年2月] FY2024曾因锂电池减值495亿日元导致营业利润同比下降27.8%。[来源：SmBom，2024年4月] 反映公司在非MLCC业务上存在减值风险，虽然不直接影响MLCC供应能力。</p>\n<h4 id=\"2\">②产能供应</h4>\n<p>✅ 利好：• 出云村田新工厂竣工（投资470亿日元），即将投产。[来源：村田官网] 印度泰米尔纳德邦MLCC封装出荷基地2026年度开始操业（投资约10亿日元）。[来源：日刊工业新闻，2025年2月] CAPEX FY2026达2,700亿日元（+50%），积极扩产。[来源：AInvest/CHOSUNBIZ]\n⚠️ 风险：• 高端MLCC产线稼动率已达95%，询单量是产能的2倍，保守扩产策略有意延长供需失衡状态。[来源：新浪财经/搜狐科技，2026年3月；passive-components.eu] 村田中岛社长本人表态\"2026年度MLCC供需可能趋于紧张\"。[来源：EE Times Japan，2026年2月] 产能扩张周期长（新工厂从建设到量产需2-3年），短期内供应紧张难以缓解。</p>\n<h4 id=\"3\">③供应链问题</h4>\n<p>⚠️ 风险：• MLCC涨价15%-35%（4月1日生效），品类覆盖AI服务器专用、高端车规级、射频微波三大类。[来源：腾讯新闻/证券时报，2026年3月17日] 涨价驱动因素包括银等关键原材料成本上涨、供需失衡。[来源：edgen.tech，2026年3月] IT环境不正访问事件（2/28发现）——社外关系者信息和社内信息可能被不正取得，影响范围和业务后果仍在调查中。[来源：村田官网，2026年3月6日]</p>\n<h4 id=\"4\">④竞争格局</h4>\n<p>⚠️ 风险：• 村田+三星电机合计市占率约55%，垄断高附加值MLCC市场，寡头定价权极强。[来源：东方财富/东莞证券，2026年3月；AInvest/CHOSUNBIZ] 三星电机2月先行涨价超20%，村田紧随其后，行业性涨价趋势已形成。[来源：新浪财经/搜狐科技，2026年3月] 村田2030年MLCC市占率目标43%（当前约40%），垂直整合与石原产业/富士钛业合资保障钛酸钡供应，竞争壁垒持续加高。[来源：AInvest/CHOSUNBIZ]</p>\n<h4 id=\"6\">⑥上下游动态</h4>\n<p>⚠️ 风险：• 上游：钛酸钡（MLCC核心原材料）供应紧张、价格呈上涨趋势。[来源：PW Consulting/USD Analytics/Procurement Resource，2026年3月] 银价上涨也是MLCC涨价驱动因素之一。[来源：edgen.tech，2026年3月] 下游：AI服务器MLCC需求到2030财年将增长3.3倍（TrendForce），AI服务器所需MLCC数量是高端智能手机的10-20倍。[来源：TrendForce；edgen.tech] 村田AI服务器电源模块FY2027目标销售额约500亿日元，正在与主要云服务商合作。[来源：TrendForce，2025年12月]</p>\n<h4 id=\"8\">⑧技术路线</h4>\n<p>✅ 利好：• ULTICIRC（中空结构LCP柔性基板）2025年12月量产化，介电率&lt;2.0。[来源：Response.jp，2026年3月] TSN over 5G世界首例接続实证成功（村田×软银×CLPA），平均同期误差122ns。[来源：村田官网，2026年2月] AI服务器电源模块2026年开始大规模生产，每台AI服务器约15,000-25,000个MLCC。[来源：TrendForce] 中岛社长提出\"MLCC脱依存\"战略，将通信模块小型薄型技术向电源模块等新领域拓展。[来源：EE Times Japan，2026年2月]</p>\n<h4 id=\"10\">⑩区域风险</h4>\n<p>⚠️ 风险：• IT环境不正访问事件发生于日本国内网络环境，调查范围和影响程度未公布，可能涉及合作伙伴数据安全。[来源：村田官网，2026年3月6日] 村田产能集中于日本（福井、出云、富山等）和海外（菲律宾、中国），地缘政治和自然灾害风险需关注。印度新工厂为产能分散化布局，但规模较小（约10亿日元投资）。[来源：日刊工业新闻，2025年2月]</p>\n<h4 id=\"11\">⑪重大合作</h4>\n<p>✅ 利好：• 富山村田（存续）吸收合并氷见村田（4月1日生效），压电陶瓷/传感器/LCP基板业务整合优化。[来源：村田官网，2026年3月] 微型一次电池事业转让至Maxell已完成（3/2），聚焦核心MLCC业务。[来源：村田官网，2026年3月] 与石原产业/富士钛业成立合资企业保障钛酸钡原材料供应（垂直整合）。[来源：AInvest/CHOSUNBIZ]</p>\n<h4 id=\"15\">⑮定价与汇率</h4>\n<p>⚠️ 风险：• MLCC涨价15%-35%直接推高采购成本，且本轮为结构性涨价周期（3-5年），非短期波动。[来源：新浪财经/搜狐科技，2026年3月] 三星电机、国巨、华新科技等主要竞品同步涨价，采购方无法通过切换供应商规避涨价。[来源：edgen.tech，2026年3月] MLCC现货价格已上涨近20%。[来源：ChosunBiz/passive-components.eu] FY2025期间圆安效果约715亿日元，汇率波动对供应商成本和定价策略产生影响。[来源：MarketScreener，2025年4月]</p>\n<p>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</p>\n<p>📉 趋势对比\n本次为首期分析，无历史数据可供对比。</p>\n<p>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</p>\n<p>📊 财务报告</p>\n<blockquote>\n<p>⚠️ <strong>数据说明</strong>：FY2023（2023年3月期）营业利润为基于FY2024 YoY（-27.8%）反推的推算值（实际数据来源为2023年度有价证券报告书，US GAAP基准，营业利润未直接披露）；FY2026为当前财年（截至Q3累计为实际值，Q4为通期予想值）；FY2023-FY2025会计基准分别为US GAAP和IFRS，数据不完全可比。FY2026 Q4尚未公布（预计2026年4月底-5月发布），以通期予想推算填充。</p>\n</blockquote>\n<h4 id=\"13\">图1：近3年营收</h4>\n<div style=\"position:relative;height:400px;width:100%;\">\n  <svg viewBox=\"0 0 800 400\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:100%;\">\n    <rect width=\"800\" height=\"400\" fill=\"#fafbfc\" rx=\"8\"/>\n    <text x=\"400\" y=\"30\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"bold\" fill=\"#333\">近3年营收（亿日元）</text>\n    <rect x=\"520\" y=\"44\" width=\"14\" height=\"10\" fill=\"#3b82f6\" opacity=\"0.8\" rx=\"2\"/>\n    <text x=\"540\" y=\"53\" font-size=\"10\" fill=\"#555\">营收</text>\n    <line x1=\"600\" y1=\"49\" x2=\"614\" y2=\"49\" stroke=\"#22c55e\" stroke-width=\"2\"/>\n    <circle cx=\"607\" cy=\"49\" r=\"3\" fill=\"#22c55e\"/>\n    <text x=\"620\" y=\"53\" font-size=\"10\" fill=\"#555\">YoY</text>\n    <line x1=\"120\" y1=\"310\" x2=\"720\" y2=\"310\" stroke=\"#999\" stroke-width=\"1\"/>\n    <line x1=\"120\" y1=\"60\" x2=\"120\" y2=\"310\" stroke=\"#999\" stroke-width=\"1\"/>\n    <line x1=\"720\" y1=\"60\" x2=\"720\" y2=\"310\" stroke=\"#ccc\" stroke-width=\"0.5\"/>\n    <line x1=\"120\" y1=\"185\" x2=\"720\" y2=\"185\" stroke=\"#eee\" stroke-dasharray=\"4,4\"/>\n    <text x=\"110\" y=\"314\" text-anchor=\"end\" font-size=\"10\" fill=\"#3b82f6\">0</text>\n    <text x=\"110\" y=\"259\" text-anchor=\"end\" font-size=\"10\" fill=\"#3b82f6\">400</text>\n    <te     "htmlBody": "<p>古河电工采购风险分析报告\n报告日期：2026年3月29日\n分析师：采购专家团</p>\n<p>📊 风险等级：🔴高\n总体评估：古河电工作为全球第二大光纤光缆供应商（份额11.3%），正处于业务扩张的高景气周期——Q3累计营收同比增长7.6%、全年业绩预测上修、宣布最高3000亿日元产能投资计划、13824心超多心光纤电缆量产且产能翻倍。然而，全球光纤行业正经历严重供应短缺，带状光纤交货期已超过60周，标准光纤价格一个月内飙升超75%，供需缺口接近1亿核心公里/年，核心瓶颈光棒产能扩建需1.5-2年。从采购方视角看，当前面临「交期极长、价格飙升、产能被预订完毕」的三重压力，短期拿货难度极大，成本显著上升。<strong>红线触发：核心产品交期超过60周，远超行业正常标准（通常4-8周）。</strong></p>\n<p>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</p>\n<p>📌 各维度风险汇总</p>\n<table>\n<thead>\n<tr>\n<th>维度优先级</th>\n<th>具体维度</th>\n<th>风险等级</th>\n<th>说明</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>🔴高优先级</td>\n<td>①公司财务状况</td>\n<td>🟢低</td>\n<td>Q3累计营收+7.6%、营业利润+11.9%，全年预测上修，财务基本面稳健</td>\n</tr>\n<tr>\n<td>🔴高优先级</td>\n<td>②产能供应</td>\n<td>🟡中</td>\n<td>三重/枥木工厂投产产能翻倍，3000亿日元投资计划扩产至3倍，但短期内产能仍被大量预订</td>\n</tr>\n<tr>\n<td>🔴高优先级</td>\n<td>③供应链问题</td>\n<td>🔴高</td>\n<td>带状光纤交期超60周，G657A2缺货，价格月涨75%+，核心瓶颈光棒产能不足</td>\n</tr>\n<tr>\n<td>🔴高优先级</td>\n<td>④竞争格局</td>\n<td>🟢低</td>\n<td>全球第2（11.3%），技术领先（13824心量产），竞品康宁/富士通同步扩张</td>\n</tr>\n<tr>\n<td>🔴高优先级</td>\n<td>⑤行业趋势</td>\n<td>🟡中</td>\n<td>数据中心需求年增75.9%，供需缺口1亿核心公里/年，光纤进入卖方市场</td>\n</tr>\n<tr>\n<td>🔴高优先级</td>\n<td>⑥上下游动态</td>\n<td>🟡中</td>\n<td>上游光棒满负荷+扩产周期长，下游AI数据中心需求爆发，Lightera品牌整合强化全球运营</td>\n</tr>\n<tr>\n<td>🟡中优先级</td>\n<td>⑦政策与合规</td>\n<td>❓ 信息不足</td>\n<td>未检索到出口管制、关税等政策变化信息</td>\n</tr>\n<tr>\n<td>🟡中优先级</td>\n<td>⑧技术路线</td>\n<td>🟢低</td>\n<td>CPO/光电融合技术领先，全球首款100mW×16通道ELS，深度参与NTT IOWN项目</td>\n</tr>\n<tr>\n<td>🟡中优先级</td>\n<td>⑨客户变化</td>\n<td>❓ 信息不足</td>\n<td>未检索到具体客户流失或新增信息（已知Meta与康宁签订60亿美元合同）</td>\n</tr>\n<tr>\n<td>🟡中优先级</td>\n<td>⑩区域风险</td>\n<td>🟢低</td>\n<td>日美两地扩产，未发现自然灾害或政治风险；关联公司债权放弃影响有限</td>\n</tr>\n<tr>\n<td>🟢低优先级</td>\n<td>⑪重大合作</td>\n<td>🟢低</td>\n<td>日美战略投资备忘录、NTT IOWN合作、收购Hakusan扩展连接器业务</td>\n</tr>\n<tr>\n<td>🟢低优先级</td>\n<td>⑫人才与组织</td>\n<td>🟢低</td>\n<td>Lightera品牌整合顺利，CATV业务重组，管理层变动细节有限但无负面影响</td>\n</tr>\n<tr>\n<td>🟢低优先级</td>\n<td>⑬财务健康度</td>\n<td>🟢低</td>\n<td>信用倍数2.76倍、ROE 9.97%、市值2.17万亿日元，财务状况健康</td>\n</tr>\n<tr>\n<td>🟢低优先级</td>\n<td>⑭专利与知识产权</td>\n<td>❓ 信息不足</td>\n<td>未检索到专利诉讼或IP纠纷信息</td>\n</tr>\n<tr>\n<td>🟢低优先级</td>\n<td>⑮定价与汇率</td>\n<td>🔴高</td>\n<td>光纤价格月涨75%+，G652.D达7年新高，市场进入\"一天一价\"模式；日元贬值利好出口</td>\n</tr>\n</tbody>\n</table>\n<p>🔍 关键风险点</p>\n<p>1、<strong>光纤交期严重超标，供应紧张</strong>\n带状光纤交货期已超过60周，部分厂商2026年产能已被预订完毕。G657A2（数据中心用特种光纤）出现结构性缺货，核心瓶颈为光棒（光学预制棒）产能不足，扩建周期需1.5-2年。[来源：GL FIBER，2026年2月；JapanTalkback/kantenna.com，2026年3月；Emtelle官网，2026年1月]</p>\n<p>2、<strong>光纤价格剧烈上涨</strong>\nG.652.D标准光纤价格在一个月内上涨超75%，达到40-50元/核心公里（7年新高）；G657A2达60-70元/核心公里。中国市场标准单模光纤从2025年底约20元涨至2026年初35元以上，报价有效期仅24小时。[来源：GL FIBER，2026年2月]</p>\n<p>3、<strong>竞品锁定长期合同，议价空间收窄</strong>\nMeta与康宁签订高达60亿美元AI数据中心光纤供应合同，中国移动等运营商招标中厂商按最高限价报价，\"价格战\"时代结束。行业采购模式从\"按需采购\"转向长期协议锁定，采购方议价能力显著削弱。[来源：JapanTalkback/kantenna.com，2026年3月；GL FIBER，2026年2月]</p>\n<p>4、<strong>3000亿日元投资计划的中长期不确定性</strong>\n虽然宣布最多3000亿日元的扩产计划，但具体投资内容、时间表和产能释放节奏尚未披露，且对当期盈利预测无影响。产能提升至3倍的目标需要数年才能实现，短期供应紧张难以缓解。[来源：Japan IR，2026年3月]</p>\n<p>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</p>\n<p>📈 详细风险分析</p>\n<h4 id=\"_1\">行业整体态势</h4>\n<p>⚠️ 风险：\n- 全球光纤市场正在从2023-2024年的库存调整期快速转向供不应求。2025年数据中心光纤需求同比增长75.9%，预计2027年数据中心将占全球光纤需求的30%，仅美国到2029年预计需新增2.133亿光纤英里。[来源：JapanTalkback/kantenna.com，2026年3月]\n- 预计2026-2027年供需缺口接近1亿核心公里/年，到2032年光纤市场规模将接近翻倍。[来源：GL FIBER，2026年2月]\n- 光纤价格进入急速上涨通道：G.652.D一个月内上涨超75%（40-50元/核心公里，7年新高），G657A2达60-70元/核心公里，市场进入\"一天一价\"模式，报价有效期仅24小时。[来源：GL FIBER，2026年2月]\n- 上游核心瓶颈：光棒（光学预制棒）占光纤成本约70%，全球主要制造商已满负荷，产能扩建需1.5-2年。[来源：GL FIBER，2026年2月；Emtelle官网，2026年1月]</p>\n<h4 id=\"_2\">竞品动态分析</h4>\n<p>⚠️ 风险：\n- <strong>康宁（Corning）</strong>：全球第1（份额19.0%），已获得Meta高达60亿美元的AI数据中心光纤供应合同。目前最高密度约1,728芯，正研发多芯光纤（Multicore Fiber）技术。大规模锁定长期合同意味着康宁产能优先供应大客户，中小采购方更难获得分配。[来源：JapanTalkback/kantenna.com，2026年3月；中邮证券，2026年3月]\n- <strong>富士通（Fujikura）</strong>：已于2025年7月推出13824芯光纤电缆（Spider Web Ribbon + Wrapping Tube Cable技术），已部署在海外超大规模数据中心，与古河电工在高端产品市场形成直接竞争。[来源：JapanTalkback/kantenna.com，2026年3月]\n- <strong>中国厂商</strong>（亨通光电11.2%、长飞光纤9.0%）：以低价策略出口东南亚、南美，在北美市场影响力有限。但在全球供应紧张背景下，中国厂商也可能受益于价格上涨。[来源：BUSINESS NETWORK，2025年6月]\n- <strong>Emtelle</strong>：通过在印尼建立战略合作新增550万光纤公里产能，积极应对全球供应紧张。[来源：Emtelle官网，2026年1月]\n- 整体影响：主要竞品均在积极扩产，但短期内产能释放有限。康宁锁定大客户进一步挤压市场可供应量，对采购方整体不利。</p>\n<h4 id=\"1\">①公司财务状况</h4>\n<p>✅ 利好：\n- Q3累计（2025年4-12月）营收9,489亿日元（同比+7.6%），营业利润351亿日元（同比+11.9%），基础设施板块和数据中心相关产品为增长主力。[来源：Yahoo!ファイナンス，2026年2月]\n- 通期业绩预测上修：销售额13,000亿日元（+8.2%）、营业利润560亿日元（+19.1%）、归母纯利润540亿日元（+61.9%），计划增加分红。[来源：古河电工官网IR，2026年2月]\n- 信用倍数2.76倍、ROE 9.97%、PBR 5.75倍，财务健康度良好。[来源：Yahoo Finance，2026年3月]</p>\n<p>⚠️ 风险：\n- 财报详细度有限：仅有Q3累计数据，缺乏Q1、Q2独立季度数据及分业务板块详细拆分。通期决算（2026年5月12日）尚未发布，上修预测有待验证。[❓ 信息不足]\n- PER 40.27倍（Forward PE 35.45倍），估值处于较高水平，股价过去一年涨幅447%，反映市场已充分计入增长预期，若业绩不及预期可能面临回调。[来源：StockAnalysis.com，2026年3月]</p>\n<h4 id=\"2\">②产能供应</h4>\n<p>✅ 利好：\n- 13824心超多心光纤电缆已开始量产，三重第2工厂+枥木第2工厂投产，超多心光纤电缆总生产能力达2023年度2倍以上。[来源：古河电工官方新闻稿，2026年3月]\n- 宣布最多3000亿日元投资政策，日美两地扩产，光纤和光缆生产能力最高提升至3倍。[来源：Japan IR，2026年3月]\n- 2025财年分项扩产计划：连接器产能→5倍、DFB激光芯片产能→5倍。[来源：亚洲化学产业信息，2025年6月]</p>\n<p>⚠️ 风险：\n- 3000亿日元投资为中长期计划，具体内容待披露，短期产能提升主要依赖已投产的三重/枥木工厂。[来源：Japan IR，2026年3月]\n- 部分厂商2026年产能已被预订完毕，古河电工产能是否同样紧张尚无直接数据，但在行业整体短缺背景下大概率供不应求。[❓ 信息不足]</p>\n<h4 id=\"3\">③供应链问题</h4>\n<p>⚠️ 风险：\n- 带状光纤交货期超过60周，远超行业正常标准（通常4-8周），<strong>触发红线条件</strong>。[来源：JapanTalkback/kantenna.com，2026年3月]\n- G657A2（数据中心用特种光纤）出现结构性缺货，生产精度要求高、拉丝效率低于G.652.D。[来源：GL FIBER，2026年2月]\n- 核心瓶颈为光棒（光学预制棒）产能不足，占光纤成本约70%，扩建周期1.5-2年。[来源：GL FIBER，2026年2月]</p>\n<h4 id=\"4\">④竞争格局</h4>\n<p>✅ 利好：\n- 古河电工全球光纤光缆市场份额11.3%，排名第2，拥有世界最高级别的13824心超多心光纤电缆量产能力。[来源：中邮证券，2026年3月；古河电工官方新闻稿，2026年3月]\n- Lightera品牌整合后统一管理全球光纤业务，北美销售占比目标从40%+提升至50%以上。[来源：OPTRONICS ONLINE，2025年3月]</p>\n<p>⚠️ 风险：\n- 与第3名亨通光电（11.2%）仅差0.1个百分点，排名并不稳固。[来源：中邮证券，2026年3月]\n- 康宁（19.0%）遥遥领先，已与Meta锁定60亿美元合同，在北美市场优势显著。[来源：JapanTalkback/kantenna.com，2026年3月]</p>\n<h4 id=\"5\">⑤行业趋势</h4>\n<p>⚠️ 风险：\n- AI数据中心所需光纤量约为传统数据中心的10倍，数据中心板块未来5年预计年均增长约20%。[来源：JapanTalkback/kantenna.com，2026年3月]\n- CPO市场规模将从2026年的3.44亿美元增长至2030年的23亿美元（年复合增长率约42.89%），NVIDIA、博通等巨头纷纷布局。[来源：日経まとめ/nikkeimatome.com，2025年10月]\n- 行业采购模式正在从\"按需采购\"转向长期协议锁定，采购方议价能力持续削弱。[来源：GL FIBER，2026年2月]</p>\n<h4 id=\"6\">⑥上下游动态</h4>\n<p>✅ 利好：\n- Lightera品牌整合（2025年4月1日生效）统一管理日本、美国、巴西的光纤业务，运营总部位于美国佐治亚州。[来源：OPTRONICS ONLINE，2025年3月]\n- 古河电工（深圳）加入光纤在线\"和光荟\"平台，深化中国市场渠道拓展。[来源：光纤在线c-fol.net，2026年3月]\n- 收购Hakusan公司扩展超大规模数据中心连接器业务。[来源：古河电工官网，2024年11月]</p>\n<p>⚠️ 风险：\n- 上游光棒全球主要制造商满负荷，扩产周期长，短期内供应瓶颈难以突破。[来源：GL FIBER，2026年2月]\n- 2025财年光纤销量预计+60%（2024财年+10%），北美+50%、中南美由-30%转+20%、EMEA由-10%转+30%，需求增速极快。[来源：CECA中国电子元件行业协会，2025年5月]\n- 关联公司债权放弃（2026年3月27日）具体金额未披露，影响待评估。[来源：古河电工官网，2026年3月]</p>\n<h4 id=\"7\">⑦政策与合规</h4>\n<p>❓ 信息不足：未检索到出口管制、关税变化、环保合规等直接影响光纤供应的政策信息。</p>\n<h4 id=\"8\">⑧技术路线</h4>\n<p>✅ 利好：\n- 全球首款CPO用100mW×16通道盲插ELS（2024年3月），55℃机箱温度下全通道100mW输出。[来源：古河电工官网，2024年]\n- 深度参与NTT IOWN项目，开发全球首款符合QSFP标准的外部光源，提升通信速度30%+并降低功耗。[来源：日経まとめ/nikkeimatome.com，2025年10月]\n- 双向拉曼放大800Gbps、超小型窄线宽可调谐光源等多款高端产品持续发布。[来源：古河电工官网，2024年]\n- NTT 2026年度将提供商用样品102.4Tbps光电解聚交换机，古河电工为产业链关键供应商。[来源：日経まとめ/nikkeimatome.com，2025年10月]</p>\n<h4 id=\"9\">⑨客户变化</h4>\n<p>❓ 信息不足：未检索到古河电工具体客户流失或新增信息。已知行业动向包括Meta与康宁签订60亿美元合同，但古河电工自身的客户结构变化尚不明确。</p>\n<h4 id=\"10\">⑩区域风险</h4>\n<p>✅ 利好：\n- 日美两地扩产战略，基于日美政府《战略投资备忘录》与美国商务部框架协议，地缘政治风险较低。[来源：Japan IR，2026年3月]</p>\n<p>⚠️ 风险：\n- 古河电工主力工厂集中在北美，此前受电信需求下降冲击较大，区域集中度存在一定风险。[来源：BUSINESS NETWORK，2025年6月]</p>\n<h4 id=\"11\">⑪重大合作</h4>\n<p>✅ 利好：\n- 与美国商务部签订框架协议，获得日美战略投资支持。[来源：Japan IR，2026年3月]\n- 与NTT深度合作IOWN项目，参加日本NEDO国家级光器件开发项目。[来源：日経まとめ/nikkeimatome.com，2025年10月]\n- 收购Hakusan扩展数据中心连接器业务版图。[来源：古河电工官网，2024年11月]</p>\n<h4 id=\"12\">⑫人才与组织</h4>\n<p>✅ 利好：\n- Lightera品牌整合后管理层国际化：董事长兼CEO Foad Shaikhzadeh（原OFS会长）、总裁兼COO Holly Hulse（原OFS总裁），运营效率有望提升。[来源：OPTRONICS ONLINE，2025年3月]</p>\n<p>⚠️ 风险：\n- 2026年3月5日执行董事及董事人事变动，3月19日CATV业务组织重组，3月27日关联公司债权放弃，具体影响有限但需关注。[来源：古河电工官网，2026年3月]</p>\n<h4 id=\"13\">⑬财务健康度</h4>\n<p>✅ 利好：\n- 信用倍数2.76倍（截至2026年3月20日），偿债能力稳健。[来源：Yahoo Finance，2026年3月]\n- ROE 9.97%，盈利能力良好；市值2.17万亿日元，资本市场认可度高。[来源：StockAnalysis.com，2026年3月]\n- 全年归母纯利润预测540亿日元（同比+61.9%），盈利增长强劲。[来源：古河电工官网IR，2026年2月]</p>\n<h4 id=\"14\">⑭专利与知识产权</h4>\n<p>❓ 信息不足：未检索到专利诉讼、技术授权纠纷或专利布局相关信息。</p>\n<h4 id=\"15\">⑮定价与汇率</h4>\n<p>⚠️ 风险：\n- 光纤价格进入急速上涨通道：G.652.D月涨超75%（7年新高）、G657A2达60-70元/核心公里，\"一天一价\"模式对采购方成本控制形成严峻挑战。[来源：GL FIBER，2026年2月]\n- 日元贬值超预期是公司上修业绩预测的因素之一，但对以日元结算的采购方而言，汇率波动可能推高采购成本。[来源：古河电工官网IR，2026年2月]\n- 中国移动等运营商招标中厂商按最高限价报价，行业\"价格战\"时代结束。[来源：GL FIBER，2026年2月]</p>\n<p>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</p>\n<p>📉 趋势对比\n本次为首期分析，无历史数据可供对比。</p>\n<p>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</p>\n<p>💡 建议措施</p>\n<h4 id=\"1-3\">短期（1-3个月）</h4>\n<p>1、<strong>紧急锁定现有供应商产能</strong>：鉴于带状光纤交期超60周且行业进入\"一天一价\"模式，建议立即与古河电工洽谈年度框架协议或长期供应合同，锁定价格和交期，避免进一步涨价。\n2、<strong>启动替代供应商评估</strong>：鉴于古河电工产能紧张，同步评估康宁、住友电工、长飞光纤等替代方案，分散供应风险。\n3、<strong>建立安全库存</strong>：在可承受范围内适当增加光纤库存，应对可能进一步延长的交货周期。</p>\n<h4 id=\"3-12\">中期（3-12个月）</h4>\n<p>1、<strong>关注通期决算（2026年5月12日）</strong>：密切跟踪古河电工全年实际业绩是否达成上修预测（销售额13,000亿/营业利润560亿），评估供应商经营稳定性。\n2、<strong>跟踪3000亿日元投资进展</strong>：关注具体投资内容披露、新工厂选址和建设时间表，评估产能释放节奏。\n3、<strong>上游光棒供应策略</strong>：评估与光棒制造商建立直接合作的可能性，或推动古河电工披露其光棒供应保障措施。</p>\n<h4 id=\"1_1\">长期（1年以上）</h4>\n<p>1、<strong>技术路线对齐</strong>：关注古河电工CPO/光电融合技术的商用化进展（NTT IOWN 2026年度商用样品、全球首款ELS产品等），在下一代数据中心架构中提前布局。\n2、<strong>区域供应多元化</strong>：古河电工正在日美两地扩产，跟踪其美国工厂产能释放情况，利用地缘优势优化供应链布局。\n3、<strong>行业供需拐点监测</strong>：全球主要光棒制造商扩产产能预计在2027-2028年释放，持续监测供需缺口收窄信号，为未来的价格谈判做准备。</p>\n<p>本报告基于公开信息整理，仅供参考。\n报告生成时间：2026年3月29日 21：13</p>\n<p>🗂️ 信息来源统计\n• 官方来源：6个 | 权威媒体：6个 | 行业分析：3个 | 其他：4个\n• 涉及竞品：康宁、富士通、亨通光电、长飞光纤、住友电工、普睿司曼、Emtelle\n• 涉及行业：光通信、数据中心/AI基础设施、5G/6G\n• 语言覆盖：日文、英文、中文（3种语言）\n• 信息不足维度：⑦政策与合规、⑨客户变化、⑭专利与知识产权</p>"

            document.querySelectorAll('.page-nav-btn')[1].classList.add('active');
            document.getElementById('updateTime').textContent =
                `共 ${REPORTS.length} 份采购报告 | 供应商采购报告`;
            if (document.getElementById('reportList').innerHTML === '') {
                renderReportList();
            }
        }
        // 切换页面时滚动到顶部
        window.scrollTo(0, 0);
    }

    // ===== 通用函数 =====
    function formatDate(dateStr) {
        const d = new Date(dateStr);
        const month = d.getMonth() + 1;
        const day = d.getDate();
        const weekdays = ['日','一','二','三','四','五','六'];
        const weekday = weekdays[d.getDay()];
        return `${month}月${day}日 周${weekday}`;
    }

    function getHighestRisk(report) {
        const levels = { 'high': 3, 'mid': 2, 'low': 1, 'none': 0 };
        let highest = 'none';
        report.suppliers.forEach(s => {
            if (levels[s.risk] > levels[highest]) highest = s.risk;
        });
        return highest;
    }

    function getRiskColor(risk) {
        return { high: 'var(--high)', mid: 'var(--mid)', low: 'var(--low)', none: 'var(--none)' }[risk];
    }

    function getRiskLabel(risk) {
        return { high: '高风险', mid: '中风险', low: '低风险', none: '无异常' }[risk];
    }

    function getRiskClass(risk) {
        return { high: 'risk-high', mid: 'risk-mid', low: 'risk-low', none: 'risk-none' }[risk];
    }

    function getRiskEmoji(risk) {
        return { high: '🔴', mid: '🟡', low: '🟢', none: '🚫' }[risk];
    }

    // ===== 页面1：采购预警 =====
    function renderDateTabs() {
        const container = document.getElementById('dateTabs');
        container.innerHTML = '';
        ALERTS.forEach((report, idx) => {
            const tab = document.createElement('div');
            tab.className = 'date-tab' + (idx === 0 ? ' active' : '');
            const risk = getHighestRisk(report);
            tab.innerHTML = formatDate(report.date) +
                `<span class="risk-dot" style="background:${getRiskColor(risk)}"></span>`;
            tab.onclick = () => selectAlert(idx);
            container.appendChild(tab);
        });
    }

    function renderStats(report) {
        const container = document.getElementById('statsBar');
        const counts = { high: 0, mid: 0, low: 0, none: 0 };
        report.suppliers.forEach(s => counts[s.risk]++);
        container.innerHTML = `
            <div class="stat-item stat-high"><span class="count">${counts.high}</span>高</div>
            <div class="stat-item stat-mid"><span class="count">${counts.mid}</span>中</div>
            <div class="stat-item stat-low"><span class="count">${counts.low}</span>低</div>
            <div class="stat-item stat-none"><span class="count">${counts.none}</span>无异常</div>
        `;
    }

    function renderAlertContent(report) {
        const container = document.getElementById('reportContent');
        if (!report) {
            container.innerHTML = `<div class="empty-state"><div class="icon">📭</div><div class="text">暂无预警数据</div></div>`;
            return;
        }
        let html = '';
        report.suppliers.forEach(supplier => {
            html += `
            <div class="supplier-card">
                <div class="card-header">
                    <div>
                        <div class="supplier-name">${supplier.name}</div>
                        ${supplier.product ? `<div class="supplier-product">${supplier.product}</div>` : ''}
                    </div>
                    <span class="risk-badge ${getRiskClass(supplier.risk)}">
                        ${getRiskEmoji(supplier.risk)} ${getRiskLabel(supplier.risk)}
                    </span>
                </div>
                <div class="card-body">
                    ${supplier.signals.length > 0
                        ? supplier.signals.map(sig => `<div class="risk-signal">${sig}</div>`).join('')
                        : `<div class="no-risk">该供应商今日未发现重大采购风险信号。</div>`
                    }
                </div>
            </div>`;
        });
        html += `<div class="report-footer">${report.footer}</div>`;
        container.innerHTML = html;
    }

    function selectAlert(idx) {
        currentAlert = ALERTS[idx];
        document.querySelectorAll('.date-tab').forEach((tab, i) => {
            tab.classList.toggle('active', i === idx);
        });
        renderStats(currentAlert);
        renderAlertContent(currentAlert);
        document.getElementById('updateTime').textContent =
            `${currentAlert.date} | 供应商采购预警`;
    }

    // ===== 页面2：采购报告 =====
    function renderReportList() {
        const container = document.getElementById('reportList');
        if (REPORTS.length === 0) {
            container.innerHTML = `<div class="empty-state"><div class="icon">📭</div><div class="text">暂无采购报告</div></div>`;
            return;
        }
        let html = '';
        REPORTS.forEach((report, idx) => {
            html += `
            <div class="report-list-card" onclick="openReport(${idx})">
                <div class="name">${report.supplierName}${report.product ? `（${report.product}）` : ''}</div>
                <div class="meta">
                    <span>${report.reportDate}</span>
                    <span>${getRiskEmoji(report.overallRisk)} ${getRiskLabel(report.overallRisk)}</span>
                </div>
                <div class="summary">${report.summary}</div>
            </div>`;
        });
        container.innerHTML = html;
    }

    function openReport(idx) {
        currentReport = REPORTS[idx];
        document.getElementById('reportList').style.display = 'none';
        const detail = document.getElementById('reportDetail');
        detail.classList.add('active');

        let html = `<button class="back-btn" onclick="closeReport()">← 返回报告列表</button>`;
        html += `<div class="report-html-body">`;
        html += currentReport.htmlBody;
        html += `</div>`;

        detail.innerHTML = html;
        document.getElementById('updateTime').textContent =
            `${currentReport.supplierName} | 供应商采购报告`;
        window.scrollTo(0, 0);
    }

    function closeReport() {
        document.getElementById('reportList').style.display = 'flex';
        document.getElementById('reportDetail').classList.remove('active');
        document.getElementById('updateTime').textContent =
            `共 ${REPORTS.length} 份采购报告 | 供应商采购报告`;
    }

    // ===== 初始化 =====
    // 动态计算顶栏高度，避免遮挡
    function adjustContentPadding() {
        const topBar = document.querySelector('.top-bar');
        const mainContent = document.querySelector('.main-content');
        if (topBar && mainContent) {
            mainContent.style.paddingTop = topBar.offsetHeight + 'px';
        }
    }
    adjustContentPadding();
    window.addEventListener('resize', adjustContentPadding);

    if (ALERTS.length > 0) {
        renderDateTabs();
        selectAlert(0);
    } else {
        document.getElementById('dateTabs').innerHTML = '';
        document.getElementById('statsBar').innerHTML = '';
        document.getElementById('reportContent').innerHTML =
            `<div class="empty-state"><div class="icon">📭</div><div class="text">暂无预警数据</div></div>`;
        document.getElementById('updateTime').textContent = '供应商采购预警';
    }
    </script>
</body>
</html>
