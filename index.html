<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>采购风险预警快报</title>
    <style>
        :root {
            --bg: #0f1117;
            --card: #1a1d27;
            --border: #2a2d3a;
            --text: #e4e4e7;
            --text-muted: #8b8d9a;
            --accent: #3b82f6;
            --high: #ef4444;
            --mid: #f59e0b;
            --low: #22c55e;
            --none: #6b7280;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #1e3a5f 0%, #0f1117 100%);
            padding: 20px 16px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
        }

        .header .subtitle {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* 日期选择器 */
        .date-tabs {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
        }
        .date-tabs::-webkit-scrollbar { display: none; }

        .date-tab {
            flex-shrink: 0;
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text-muted);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .date-tab.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .date-tab:hover:not(.active) {
            border-color: var(--accent);
            color: var(--text);
        }

        .date-tab .risk-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-left: 6px;
            vertical-align: middle;
        }

        /* 统计栏 */
        .stats-bar {
            display: flex;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .stat-item .count {
            font-weight: 600;
            font-size: 16px;
        }

        .stat-high .count { color: var(--high); }
        .stat-mid .count { color: var(--mid); }
        .stat-low .count { color: var(--low); }
        .stat-none .count { color: var(--none); }

        /* 快报内容 */
        .report-content {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .supplier-card {
            background: var(--card);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
            transition: transform 0.2s;
        }

        .supplier-card:hover {
            transform: translateY(-1px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
        }

        .supplier-name {
            font-size: 15px;
            font-weight: 600;
        }

        .supplier-product {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .risk-badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }

        .risk-high { background: rgba(239,68,68,0.15); color: var(--high); }
        .risk-mid { background: rgba(245,158,11,0.15); color: var(--mid); }
        .risk-low { background: rgba(34,197,94,0.15); color: var(--low); }
        .risk-none { background: rgba(107,114,128,0.15); color: var(--none); }

        .card-body {
            padding: 14px 16px;
        }

        .risk-signal {
            padding: 8px 0;
            border-bottom: 1px solid rgba(42,45,58,0.5);
            font-size: 13px;
            line-height: 1.7;
        }

        .risk-signal:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .no-risk {
            color: var(--text-muted);
            font-size: 13px;
            font-style: italic;
        }

        /* 底部信息 */
        .report-footer {
            padding: 12px 16px;
            border-top: 1px solid var(--border);
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
        .empty-state .text { font-size: 14px; }

        /* 加载状态 */
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }

        @media (min-width: 768px) {
            .header { padding: 24px 32px; }
            .header h1 { font-size: 22px; }
            .date-tabs { padding: 12px 32px; }
            .report-content { padding: 20px 32px; }
            .stats-bar { padding: 12px 32px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📋 采购风险预警快报</h1>
        <div class="subtitle" id="updateTime">加载中...</div>
    </div>

    <div class="date-tabs" id="dateTabs"></div>
    <div class="stats-bar" id="statsBar"></div>
    <div class="report-content" id="reportContent">
        <div class="loading">加载中...</div>
    </div>

    <script>
    // 快报数据 - 由构建脚本生成
    const REPORTS = __REPORTS_DATA__;

    let currentReport = null;

    function formatDate(dateStr) {
        const d = new Date(dateStr);
        const month = d.getMonth() + 1;
        const day = d.getDate();
        const weekdays = ['日','一','二','三','四','五','六'];
        const weekday = weekdays[d.getDay()];
        return `${month}月${day}日 周${weekday}`;
    }

    function getHighestRisk(report) {
        const levels = { 'high': 3, 'mid': 2, 'low': 1, 'none': 0 };
        let highest = 'none';
        report.suppliers.forEach(s => {
            if (levels[s.risk] > levels[highest]) highest = s.risk;
        });
        return highest;
    }

    function getRiskColor(risk) {
        return { high: 'var(--high)', mid: 'var(--mid)', low: 'var(--low)', none: 'var(--none)' }[risk];
    }

    function getRiskLabel(risk) {
        return { high: '高风险', mid: '中风险', low: '低风险', none: '无异常' }[risk];
    }

    function getRiskClass(risk) {
        return { high: 'risk-high', mid: 'risk-mid', low: 'risk-low', none: 'risk-none' }[risk];
    }

    function getRiskEmoji(risk) {
        return { high: '🔴', mid: '🟡', low: '🟢', none: '🚫' }[risk];
    }

    function renderDateTabs() {
        const container = document.getElementById('dateTabs');
        container.innerHTML = '';
        REPORTS.forEach((report, idx) => {
            const tab = document.createElement('div');
            tab.className = 'date-tab' + (idx === 0 ? ' active' : '');
            const risk = getHighestRisk(report);
            tab.innerHTML = formatDate(report.date) +
                `<span class="risk-dot" style="background:${getRiskColor(risk)}"></span>`;
            tab.onclick = () => selectReport(idx);
            container.appendChild(tab);
        });
    }

    function renderStats(report) {
        const container = document.getElementById('statsBar');
        const counts = { high: 0, mid: 0, low: 0, none: 0 };
        report.suppliers.forEach(s => counts[s.risk]++);
        container.innerHTML = `
            <div class="stat-item stat-high"><span class="count">${counts.high}</span>高</div>
            <div class="stat-item stat-mid"><span class="count">${counts.mid}</span>中</div>
            <div class="stat-item stat-low"><span class="count">${counts.low}</span>低</div>
            <div class="stat-item stat-none"><span class="count">${counts.none}</span>无异常</div>
        `;
    }

    function renderReport(report) {
        const container = document.getElementById('reportContent');

        if (!report) {
            container.innerHTML = `<div class="empty-state"><div class="icon">📭</div><div class="text">暂无快报数据</div></div>`;
            return;
        }

        let html = '';
        report.suppliers.forEach(supplier => {
            html += `
            <div class="supplier-card">
                <div class="card-header">
                    <div>
                        <div class="supplier-name">${supplier.name}</div>
                        ${supplier.product ? `<div class="supplier-product">${supplier.product}</div>` : ''}
                    </div>
                    <span class="risk-badge ${getRiskClass(supplier.risk)}">
                        ${getRiskEmoji(supplier.risk)} ${getRiskLabel(supplier.risk)}
                    </span>
                </div>
                <div class="card-body">
                    ${supplier.signals.length > 0
                        ? supplier.signals.map(sig => `<div class="risk-signal">${sig}</div>`).join('')
                        : `<div class="no-risk">该供应商今日未发现重大采购风险信号。</div>`
                    }
                </div>
            </div>`;
        });

        html += `<div class="report-footer">${report.footer}</div>`;
        container.innerHTML = html;
    }

    function selectReport(idx) {
        currentReport = REPORTS[idx];
        document.querySelectorAll('.date-tab').forEach((tab, i) => {
            tab.classList.toggle('active', i === idx);
        });
        renderStats(currentReport);
        renderReport(currentReport);
        document.getElementById('updateTime').textContent =
            `${currentReport.date} | 采购发现团自动生成`;
    }

    // 初始化
    if (REPORTS.length > 0) {
        renderDateTabs();
        selectReport(0);
    } else {
        document.getElementById('dateTabs').innerHTML = '';
        document.getElementById('statsBar').innerHTML = '';
        document.getElementById('reportContent').innerHTML =
            `<div class="empty-state"><div class="icon">📭</div><div class="text">暂无快报数据</div></div>`;
        document.getElementById('updateTime').textContent = '采购发现团快报看板';
    }
    </script>
</body>
</html>
